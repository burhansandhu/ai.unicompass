services:
  - type: web
    name: unicompass-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: unicompass-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: unicompass-db
    databaseName: unicompass
    user: unicompass
    plan: free
